name: Linux packages
on:
  push:
    branches: [main, linux-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            frontend/desktop/package-lock.json
      - name: Linux build tools and Flatpak with input-device permissions
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder xvfb xauth dbus-x11 libgtk-3-0t64 libnss3 libatk-bridge2.0-0t64 libasound2t64 libgbm1 libxss1 libudev-dev libusb-1.0-0-dev
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Install dependencies
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Linux behavior and real MPRIS session
        working-directory: frontend
        run: |
          dbus-run-session -- npm run test:linux
          npx tsc --noEmit
      - name: Build AppImage and Flatpak
        working-directory: frontend
        run: npm run electron:build:linux
      - name: Packaged launcher, backend and game lifecycle
        working-directory: frontend
        # Root's --no-sandbox is confined to the isolated test process.
        run: sudo --preserve-env=PATH node scripts/smoke-linux.cjs
      - name: Checksums
        working-directory: frontend/dist-electron
        run: sha256sum *.AppImage *.flatpak > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: WPS5-Linux-x86_64
          compression-level: 0
          if-no-files-found: error
          path: |
            frontend/dist-electron/*.AppImage
            frontend/dist-electron/*.flatpak
            frontend/dist-electron/SHA256SUMS
            frontend/dist-electron/linux-smoke.*